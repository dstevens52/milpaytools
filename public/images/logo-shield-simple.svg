<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">MilPayTools favicon shield</title>
  <desc id="desc">Simplified MilPayTools shield favicon with a white shield outline and red dollar badge.</desc>
  <defs>
    <linearGradient id="navyGradFav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2A57"/>
      <stop offset="100%" stop-color="#031C3D"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square for favicon/app icon use -->
  <rect x="8" y="8" width="240" height="240" rx="38" fill="url(#navyGradFav)"/>

  <!-- Shield outline only -->
  <path d="M128 42 L184 64 V116 C184 169 156 205 128 228 C100 205 72 169 72 116 V64 Z"
        fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>

  <!-- Dollar badge only -->
  <circle cx="128" cy="162" r="28" fill="#E3202A" stroke="#FFFFFF" stroke-width="5"/>
  <text x="128" y="173" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">$</text>
</svg>
