<svg xmlns="http://www.w3.org/2000/svg" width="512" height="640" viewBox="0 0 256 320" role="img" aria-labelledby="title desc">
  <title id="title">MilPayTools shield icon</title>
  <desc id="desc">Navy shield outline containing a calculator, with a red dollar badge at the bottom.</desc>
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2A57"/>
      <stop offset="100%" stop-color="#031C3D"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00122B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer shield -->
  <path d="M128 16 L210 48 V126 C210 208 167 262 128 294 C89 262 46 208 46 126 V48 Z"
        fill="url(#navyGrad)" filter="url(#softShadow)"/>

  <!-- Inner white outline -->
  <path d="M128 36 L192 61 V125 C192 195 156 244 128 270 C100 244 64 195 64 125 V61 Z"
        fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>

  <!-- Calculator body -->
  <rect x="82" y="74" width="92" height="116" rx="10" fill="#FFFFFF"/>
  <rect x="94" y="86" width="68" height="24" rx="5" fill="url(#navyGrad)" opacity="0.92"/>

  <!-- Calculator buttons -->
  <g fill="#0B2A57">
    <rect x="94" y="122" width="16" height="16" rx="3"/>
    <rect x="120" y="122" width="16" height="16" rx="3"/>
    <rect x="146" y="122" width="16" height="16" rx="3"/>

    <rect x="94" y="148" width="16" height="16" rx="3"/>
    <rect x="120" y="148" width="16" height="16" rx="3"/>
    <rect x="146" y="148" width="16" height="16" rx="3"/>
  </g>

  <!-- Dollar badge -->
  <circle cx="128" cy="206" r="32" fill="#E3202A" stroke="#FFFFFF" stroke-width="6"/>
  <text x="128" y="219" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">$</text>
</svg>
