name: E2E gate

# Tier 2/3 test gate (CLAUDE.md "Testing" → "CI gate"). Every PR to main gets the
# full Playwright suite on all three browsers against a production build
# (`next start` on localhost), plus the data-only checks. Tier 1 stays local.
#
# The `report` job is the gate: it merges every shard's blob report, classifies
# failures against tests/known-failures.json (scripts/ci-known-failures.ts) and
# fails only on new failures, zero tests, or tests missing from the report.
# The e2e shard jobs themselves stay green when tests fail, so a known failure
# never shows as a red check; a shard that crashes or times out leaves tests
# missing, which the report job catches.
#
# No secrets: the build and the tests need no env vars (see CI_BUILD_REPORT.md).
# Nothing here deploys, calls IndexNow or touches the live site.

# Runners are pinned to ubuntu-24.04: ubuntu-latest moved to 26.04, which
# Playwright 1.59.1 does not support.

# No `ready_for_review`: drafts already run the gate, so marking a PR ready would only re-run the
# whole suite on a commit that has passed (it did on #42 and #43).
#
# Manual runs (workflow_dispatch): with `specs` empty, the full gate. With `specs` set, a repeat
# run instead (proving a flake fixed): only those spec files, --repeat-each=N, on each chosen
# browser, against a production build; the `repeat` job fails on any failure.
#   gh workflow run e2e.yml --ref <branch> -f specs="tests/e2e/a.spec.ts" -f browsers="webkit" -f repeat_each=10
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      specs:
        description: 'Repeat run: spec files, space-separated (e.g. tests/e2e/a.spec.ts tests/e2e/b.spec.ts). Empty = full gate.'
        type: string
        default: ''
      browsers:
        description: 'Repeat run: browsers, space-separated (chromium firefox webkit)'
        type: string
        default: 'chromium firefox webkit'
      repeat_each:
        description: 'Repeat run: --repeat-each (1-50)'
        type: number
        default: 10

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # The Playwright version from package-lock.json picks the container image, so
  # the image always matches the installed @playwright/test.
  # Also decides the mode: `full` (PRs, and manual runs with no specs) or `repeat`.
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.pw.outputs.version }}
      mode: ${{ steps.mode.outputs.mode }}
      specs: ${{ steps.mode.outputs.specs }}
      browsers: ${{ steps.mode.outputs.browsers }}
      repeat_each: ${{ steps.mode.outputs.repeat_each }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: pw
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          test -n "$v" && echo "version=$v" | tee -a "$GITHUB_OUTPUT"
      # Inputs go through env, never into the script text, and are validated before use.
      - id: mode
        env:
          SPECS: ${{ github.event_name == 'workflow_dispatch' && inputs.specs || '' }}
          BROWSERS: ${{ github.event_name == 'workflow_dispatch' && inputs.browsers || '' }}
          REPEAT: ${{ github.event_name == 'workflow_dispatch' && inputs.repeat_each || '' }}
        run: |
          specs=$(echo "$SPECS" | xargs)
          if [ -z "$specs" ]; then
            echo "mode=full" | tee -a "$GITHUB_OUTPUT"
            echo 'browsers=["chromium"]' >> "$GITHUB_OUTPUT" # placeholder; `repeat` is skipped
            exit 0
          fi
          if ! printf '%s' "$specs" | grep -Eq '^[A-Za-z0-9._/: -]+$'; then
            echo "::error::specs may only contain letters, digits, . _ / : - and spaces"; exit 1
          fi
          list='['
          for b in $BROWSERS; do
            case "$b" in chromium|firefox|webkit) ;; *) echo "::error::unknown browser: $b"; exit 1 ;; esac
            list="$list\"$b\","
          done
          list="${list%,}]"
          if [ "$list" = '[]' ] || [ "$list" = '[' ]; then echo "::error::no browsers chosen"; exit 1; fi
          if ! printf '%s' "$REPEAT" | grep -Eq '^[0-9]+$' || [ "$REPEAT" -lt 1 ] || [ "$REPEAT" -gt 50 ]; then
            echo "::error::repeat_each must be 1-50"; exit 1
          fi
          {
            echo "mode=repeat"
            echo "specs=$specs"
            echo "browsers=$list"
            echo "repeat_each=$REPEAT"
          } | tee -a "$GITHUB_OUTPUT"

  # Build inside the same image the tests run in, so `next start` sees the same
  # paths and OS as `next build`. The image ships the browsers and their system
  # packages; installing those on a plain runner took 12–20 minutes per job.
  build:
    needs: versions
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.versions.outputs.playwright }}-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Working tree after prebuild (informational)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --porcelain
      # .next is a hidden folder (upload-artifact skips those by default) and
      # .next/cache is not needed by `next start`, so ship one tar without it.
      - name: Pack build output
        run: |
          tar -cf next-build.tar --exclude=.next/cache .next
          ls -lh next-build.tar
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar
          retention-days: 3

  data-tests:
    needs: versions
    if: ${{ needs.versions.outputs.mode != 'repeat' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Data-only specs: no page fixture, no browser, no server.
      - run: npm run test:pay-table
      - run: npm run test:pay-raise
      - run: npm run test:figures
      - run: npm run test:pay-dates

  e2e:
    needs: [versions, build]
    if: ${{ needs.versions.outputs.mode != 'repeat' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.versions.outputs.playwright }}-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    env:
      E2E_SERVER: prod
      SHARD_TOTAL: 2 # keep in step with matrix.shard
      HOME: /root # Firefox refuses to start as root when HOME isn't root's
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - name: Unpack build output
        run: tar -xf next-build.tar && rm next-build.tar && test -f .next/BUILD_ID && echo "BUILD_ID $(cat .next/BUILD_ID)"
      # The container runs as root but the checkout belongs to the runner user;
      # without this, git refuses the repo and specs that call git grep fail.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # --retries=0 overrides the config's CI retries (2) so CI matches the local gate.
      # The exit code is recorded, not raised: the report job is the gate.
      - name: Playwright ${{ matrix.browser }} shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.browser }}-${{ matrix.shard }}.zip
        run: |
          set +e
          npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} \
            --workers=2 --retries=0 --reporter=blob,list
          code=$?
          echo "Playwright exit code: $code (gate is decided in the report job)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  # Repeat run (manual, `specs` set): chosen specs × --repeat-each on each chosen browser. No
  # known-failures allowance: any failure fails the job. Not a required check.
  repeat:
    needs: [versions, build]
    if: ${{ needs.versions.outputs.mode == 'repeat' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.versions.outputs.playwright }}-noble
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.versions.outputs.browsers) }}
    env:
      E2E_SERVER: prod
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - name: Unpack build output
        run: tar -xf next-build.tar && rm next-build.tar && test -f .next/BUILD_ID && echo "BUILD_ID $(cat .next/BUILD_ID)"
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Playwright ${{ matrix.browser }} × ${{ needs.versions.outputs.repeat_each }}
        env:
          SPECS: ${{ needs.versions.outputs.specs }}
          REPEAT: ${{ needs.versions.outputs.repeat_each }}
          BROWSER: ${{ matrix.browser }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: repeat-report.json
        run: |
          set -f # specs are validated in `versions`; no globbing
          set +e
          npx playwright test $SPECS --project="$BROWSER" --repeat-each="$REPEAT" \
            --workers=2 --retries=0 --reporter=json,list
          echo "Playwright exit code: $?"
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: repeat-report-${{ matrix.browser }}
          path: repeat-report.json
          retention-days: 14
      - name: Result (gate for this run)
        env:
          SPECS: ${{ needs.versions.outputs.specs }}
          REPEAT: ${{ needs.versions.outputs.repeat_each }}
          BROWSER: ${{ matrix.browser }}
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("repeat-report.json")) { console.log("::error::no report"); process.exit(1); }
            const r = JSON.parse(fs.readFileSync("repeat-report.json", "utf8"));
            const s = r.stats;
            const fails = [];
            (function walk(x) {
              (x.suites || []).forEach(walk);
              (x.specs || []).forEach((sp) => sp.tests.forEach((t) => t.results.forEach((res) => {
                if (res.status !== "passed" && res.status !== "skipped") fails.push(`${sp.file}:${sp.line} ${sp.title} (${res.status})`);
              })));
            })(r);
            const lines = [
              `## Repeat run — ${process.env.BROWSER} × ${process.env.REPEAT}`,
              `Specs: \`${process.env.SPECS}\``,
              "", "### stats (verbatim)", "```json", JSON.stringify(s, null, 2), "```", "",
              `### Failures: ${fails.length}`, ...fails.map((f) => `- ${f}`),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
            if (s.expected + s.unexpected + s.flaky === 0) { console.log("::error::zero tests ran (check the spec paths)"); process.exit(1); }
            if (s.unexpected > 0 || s.flaky > 0 || fails.length) process.exit(1);
          '

  # `!= 'repeat'`, not `== 'full'`: if `versions` fails, mode is empty and `report` must still
  # run (and fail on zero tests). A skipped required check counts as passing.
  report:
    needs: [versions, e2e]
    if: ${{ always() && needs.versions.outputs.mode != 'repeat' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Blob reports received
        run: ls -l all-blob-reports || true
      # The test list for this commit, to prove every test came back.
      - name: List expected tests
        run: npx playwright test --list --reporter=json > expected-list.json
      - name: Merge reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: merged-report.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
        run: npx playwright merge-reports --reporter=json,html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: merged-report
          path: |
            merged-report.json
            expected-list.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: html-report
          path: playwright-report
          retention-days: 14
      - name: Classify against known failures (gate)
        run: npx tsx scripts/ci-known-failures.ts merged-report.json --expected expected-list.json --summary "$GITHUB_STEP_SUMMARY"
